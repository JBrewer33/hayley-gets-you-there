  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

">View work<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative;background:repeating-linear-gradient(135deg,#0c333a,#0c333a 14px,#11464E 14px,#11464E 28px);min-height:340px;display:flex;align-items:flex-end;justify-content:flex-start;padding:24px;\">\n          <span style=\"font-family:'Courier New',monospace;font-size:11px;letter-spacing:0.06em;color:#F4EEE1;background:rgba(14,58,64,0.78);border:1px solid rgba(244,238,225,0.25);padding:7px 12px;border-radius:2px;\">HERO IMAGE · drop a wide travel photo here<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- VARIANT: FULL-BLEED IMMERSIVE -->\n    <sc-if value=\"{{ isImmersive }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:relative;min-height:92vh;background:repeating-linear-gradient(135deg,#0c333a,#0c333a 16px,#11464E 16px,#11464E 32px);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;\">\n        <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,58,64,0.55),rgba(14,58,64,0.86));\"><\u002Fdiv>\n        <span style=\"position:absolute;top:18px;left:18px;font-family:'Courier New',monospace;font-size:11px;color:#F4EEE1;background:rgba(14,58,64,0.7);border:1px solid rgba(244,238,225,0.25);padding:7px 12px;border-radius:2px;z-index:2;\">FULL-BLEED IMAGE · destination photo<\u002Fspan>\n        <div style=\"position:relative;z-index:3;padding:40px 24px;animation:hmRise .8s ease both;\">\n          <img src=\"dd431bcc-cf28-4e3e-8694-6641f1faa056\" width=\"86\" height=\"106\" alt=\"\" style=\"width:clamp(64px,9vw,90px);height:auto;margin:0 auto;display:block;opacity:.95;\">\n          <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;color:#F4EEE1;font-size:clamp(2.8rem,1.6rem+4vw,5rem);line-height:1.02;margin:22px 0 0;letter-spacing:0.02em;\">Hayley Marché<\u002Fh1>\n          <p style=\"font-size:13px;font-weight:600;letter-spacing:0.42em span>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;color:#F4EEE1;font-size:clamp(2.6rem,1.5rem+3.6vw,4.6rem);line-height:1.05;margin:18px 0 0;max-width:16ch;\">Meaningful events &amp; unforgettable travel.<\u002Fh1>\n        <p style=\"font-family:'Dancing Script',cursive;font-size:clamp(1.8rem,1.2rem+1.8vw,2.6rem);color:#E9C9A8;margin:14px 0 0;line-height:1;\">let's get you there<\u002Fp>\n        <a href=\"#contact\" style=\"display:inline-block;margin-top:30px;text-decoration:none;background:#C76B38;color:#F4EEE1;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;padding:15px 30px;border-radius:2px;\">Start planning<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <!-- ===================== ABOUT ===================== -->\n  <section id=\"about\" data-screen-label=\"About\" style=\"background:#FBF8F1;padding:clamp(56px,8vw,104px) 24px;\">\n    <div style=\"max-width:1080px;margin:0 auto;\">\n      <!-- banner + overlapping headshot -->\n      <div style=\"position:relative;border-radius:6px;overflow:visible;\">\n        <div style=\"position:relative;height:clamp(220px,34vw,380px);border-radius:6px;background:repeating-linear-gradient(135deg,#e6dfce,#e6dfce 16px,#efe8d8 16px,#efe8d8 32px);display:flex;align-items:flex-start;justify-content:flex-end;padding:18px;\">\n          <span style=\"font-family:'Courier New',monospace;font-size:11px;color:#0E3A40;background:rgba(251,248,241,0.85);border:1px solid rgba(14,58,64,0.18);padding:7px 12px;border-radius:2px;\">DESTINATION PHOTO · e.g. Vienna, Hofburg<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:clamp(12px,4vw,40px);bottom:-46px;width:clamp(150px,20vw,210px);aspect-ratio:1/1.15;border-radius:6px;border:6px solid #FBF8F1;box-shadow:0 12px 30px rgba(14,58,64,0.18);overflow:hidden;\">\n          <img src=\"0a1833d8-b020-4e00-954a-371759b13757\" alt=\"Hayley Marché\" style=\"width:100%;height:100%;object-fit:cover;object-position:center top;display:block;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:clamp(20px,4vw,48px);align-items:end;margin-top:62px;\">\n        <div><\u002Fdiv>\n        <div>\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;color:#0E3A40;font-size:clamp(1.8rem,1rem+2.6vw,3rem);line-height:1.12;margin:0;\">Hi, I'm Hayley — your partner in <em style=\"font-style:italic;color:#0E3A40;\">meaningful events and unforgettable travel.<\u002Fem><\u002Fh2>\n          <span style=\"display:block;width:54px;height:2px;background:#C76B38;margin-top:20px;\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);margin-top:clamp(40px,6vw,72px);\">\n        <div>\n          <h3 style=\"font-size:13px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#0E3A40;margin:0 0 22px;\">Experience Overview<\u002Fh3>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px;\">\n            <sc-for list=\"{{ overview }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <li style=\"display:flex;gap:16px;align-items:flex-start;\">\n                <span style=\"flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid #C76B38;display:flex;align-items:center;justify-content:center;color:#C76B38;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;\">{{ o.n }}<\u002Fspan>\n                <p style=\"margin:0;color:#3c4a4c;font-size:0.96rem;line-height:1.6;\">{{ o.text }}<\u002Fp>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:13px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#0E3A40;margin:0 0 22px;\">My Story<\u002Fh3>\n          <p style=\"margin:0 0 16px;color:#3c4a4c;font-size:0.98rem;line-height:1.7;\">I've always believed the best moments in life come from connection — whether it's a perfectly planned event, an inspiring destination, or the people we share them with.<\u002Fp>\n          <p style=\"margin:0 0 16px;color:#3c4a4c;font-size:0.98rem;line-height:1.7;\">With an extensive background in experiential event and travel design, I help clients bring their visions to life through the same high-level planning experience I've delivered to executives.<\u002Fp>\n          <p style=\"margin:0;color:#3c4a4c;font-size:0.98rem;line-height:1.7;\">I'm based in my picturesque hometown of Winter Garden, just outside Orlando, Florida, where I live with my two pups and a cat.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- based in + more about me -->\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);margin-top:clamp(40px,6vw,72px);align-items:center;\">\n        <div style=\"display:flex;align-items:center;gap:22px;\">\n          <span style=\"flex:none;width:96px;height:96px;border-radius:50%;border:1.5px solid #9aa9a4;position:relative;display:block;\">\n            <span style=\"position:absolute;left:0;right:0;top:50%;height:1px;background:#9aa9a4;\"><\u002Fspan>\n            <span style=\"position:absolute;top:0;bottom:0;left:50%;width:1px;background:#9aa9a4;\"><\u002Fspan>\n            <span style=\"position:absolute;left:30%;top:36%;width:10px;height:10px;border-radius:50%;background:#C76B38;\"><\u002Fspan>\n          <\u002Fspan>\n          <div>\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#5A6B6E;\">Based in<\u002Fspan>\n            <p style=\"font-family:'Cormorant Garamond',serif;font-weight:600;color:#0E3A40;font-size:1.7rem;line-height:1.1;margin:4px 0 6px;\">Winter Garden, Florida<\u002Fp>\n            <p style=\"margin:0;color:#5A6B6E;font-size:0.9rem;\">Creating experiences wherever you're headed.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0E3A40;border-radius:6px;padding:26px 28px;\">\n          <h4 style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#C76B38;margin:0 0 12px;\">A little more about me<\u002Fh4>\n          <p style=\"margin:0;color:#E8E2D4;font-size:0.96rem;line-height:1.7;\">I believe in balance — big adventures and quiet moments, thoughtful details and room for spontaneity. The best journeys leave a little space for the unexpected.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== SERVICES ===================== -->\n  <section id=\"services\" data-screen-label=\"Services\" style=\"background:#0E3A40;padding:clamp(56px,8vw,104px) 24px;\">\n    <div style=\"max-width:1080px;margin:0 auto;\">\n      <div style=\"text-align:center;max-width:36rem;margin:0 auto;\">\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:0.32em;text-transform:uppercase;color:#C76B38;\">What I do<\u002Fspan>\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;color:#F4EEE1;font-size:clamp(2rem,1.2rem+2.4vw,3.2rem);line-height:1.1;margin:14px 0 0;\">Full-service planning, start to finish<\u002Fh2>\n        <p style=\"color:#C9D2CF;font-size:1rem;line-height:1.65;margin:18px 0 0;\">From the first spark of an idea to the final send-off, every detail is handled with care.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:clamp(36px,5vw,60px);\">\n        <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <div style=\"background:#11464E;border:1px solid rgba(244,238,225,0.1);border-radius:6px;padding:30px 26px;transition:transform .2s,border-color .2s;\" style-hover=\"transform:translateY(-4px);border-color:rgba(199,107,56,0.55);\">\n            <span style=\"display:flex;width:46px;height:46px;border-radius:50%;background:rgba(199,107,56,0.14);align-items:center;justify-content:center;color:#E9C9A8;font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;\">{{ s.n }}<\u002Fspan>\n            <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;color:#F4EEE1;font-size:1.5rem;margin:18px 0 8px;\">{{ s.title }}<\u002Fh3>\n            <p style=\"margin:0;color:#C9D2CF;font-size:0.94rem;line-height:1.65;\">{{ s.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== PORTFOLIO ===================== -->\n  <section id=\"portfolio\" data-screen-label=\"Portfolio\" style=\"background:#FBF8F1;padding:clamp(56px,8vw,104px) 24px;\">\n    <div style=\"max-width:1140px;margin:0 auto;\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;\">\n        <div>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:0.32em;text-transform:uppercase;color:#C76B38;\">Selected work<\u002Fspan>\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;color:#0E3A40;font-size:clamp(2rem,1.2rem+2.4vw,3.2rem);line-height:1.1;margin:12px 0 0;\">A look at past experiences<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n          <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:clamp(32px,4vw,52px);\">\n        <sc-for list=\"{{ filteredPortfolio }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"position:relative;border-radius:6px;overflow:hidden;aspect-ratio:4/5;background:repeating-linear-gradient(135deg,#e3dccb,#e3dccb 14px,#ece6d6 14px,#ece6d6 28px);cursor:pointer;\">\n            <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,58,64,0) 38%,rgba(14,58,64,0.82));\"><\u002Fdiv>\n            <span style=\"position:absolute;top:14px;left:14px;font-family:'Courier New',monospace;font-size:10px;color:#0E3A40;background:rgba(251,248,241,0.8);padding:5px 9px;border-radius:2px;\">IMG<\u002Fspan>\n            <div style=\"position:absolute;left:18px;right:18px;bottom:16px;\">\n              <span style=\"font-size:10px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:#E9C9A8;\">{{ p.category }}<\u002Fspan>\n              <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;color:#F4EEE1;font-size:1.32rem;line-height:1.15;margin:5px 0 0;\">{{ p.title }}<\u002Fh3>\n              <p style=\"margin:3px 0 0;color:#C9D2CF;font-size:0.82rem;\">{{ p.place }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== INSTAGRAM ===================== -->\n  <section id=\"instagram\" data-screen-label=\"Instagram\" style=\"background:#fff;padding:clamp(56px,8vw,104px) 24px;\">\n    <div style=\"max-width:1140px;margin:0 auto;text-align:center;\">\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:0.32em;text-transform:uppercase;color:#C76B38;\">Follow along<\u002Fspan>\n      <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;color:#0E3A40;font-size:clamp(2rem,1.2rem+2.4vw,3.2rem);line-height:1.1;margin:12px 0 6px;\">From the feed<\u002Fh2>\n      <a href=\"{{ igUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#C76B38;font-size:0.95rem;font-weight:600;letter-spacing:0.04em;\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" style=\"width:18px;height:18px;\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.5\" cy=\"6.5\" r=\"0.6\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n        @hayleygetsyouthere\n      <\u002Fa>\n\n      <!-- REPLACE WITH WIDGET EMBED (behold.so / lightwidget / snapwidget) -->\n      <div class=\"ig-grid\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:clamp(28px,4vw,44px);\">\n        <sc-for list=\"{{ igTiles }}\" as=\"t\" hint-placeholder-count=\"8\">\n          <a href=\"{{ igUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"position:relative;aspect-ratio:1/1;border-radius:3px;overflow:hidden;background:{{ t.bg }};text-decoration:none;display:block;\" style-hover=\"opacity:.92;\">\n            <span style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(244,238,225,0.85);\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" style=\"width:26px;height:26px;\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.5\" cy=\"6.5\" r=\"0.6\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n            <\u002Fspan>\n            <span style=\"position:absolute;bottom:8px;left:8px;font-family:'Courier New',monospace;font-size:9px;color:rgba(244,238,225,0.8);\">{{ t.label }}<\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <a href=\"{{ igUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:34px;text-decoration:none;border:1px solid #C76B38;color:#C76B38;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;padding:13px 28px;border-radius:2px;transition:all .15s;\" style-hover=\"background:#C76B38;color:#fff;\">Follow on Instagram<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== TESTIMONIALS ===================== -->\n  <section data-screen-label=\"Testimonials\" style=\"background:#11464E;padding:clamp(56px,8vw,104px) 24px;\">\n    <div style=\"max-width:1080px;margin:0 auto;\">\n      <div style=\"text-align:center;\">\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:0.32em;text-transform:uppercase;color:#C76B38;\">Kind words<\u002Fspan>\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;color:#F4EEE1;font-size:clamp(2rem,1.2rem+2.4vw,3.2rem);line-height:1.1;margin:12px 0 0;\">What clients say<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:clamp(34px,5vw,56px);\">\n        <sc-for list=\"{{ testimonials }}\" as=\"q\" hint-placeholder-count=\"3\">\n          <figure style=\"margin:0;background:rgba(244,238,225,0.05);border:1px solid rgba(244,238,225,0.12);border-radius:6px;padding:30px 28px;\">\n            <span style=\"font-family:'Cormorant Garamond',serif;font-size:3rem;line-height:0.6;color:#C76B38;display:block;height:24px;\">“<\u002Fspan>\n            <blockquote style=\"margin:0;color:#E8E2D4;font-size:1rem;line-height:1.7;font-style:italic;font-family:'Cormorant Garamond',serif;font-weight:500;\">{{ q.quote }}<\u002Fblockquote>\n            <figcaption style=\"margin-top:18px;font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#C9D2CF;\">{{ q.name }} <span style=\"color:#7e9298;font-weight:500;\">· {{ q.detail }}<\u002Fspan><\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== CONTACT ===================== -->\n  <section id=\"contact\" data-screen-label=\"Contact\" style=\"background:#FBF8F1;padding:clamp(56px,8vw,104px) 24px;\">\n    <div style=\"max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,64px);align-items:start;\">\n      <div>\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:0.32em;text-transform:uppercase;color:#C76B38;\">Let's connect<\u002Fspan>\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;color:#0E3A40;font-size:clamp(2rem,1.2rem+2.4vw,3.2rem);line-height:1.1;margin:12px 0 0;\">Let's create something unforgettable together.<\u002Fh2>\n        <p style=\"color:#5A6B6E;font-size:1rem;line-height:1.65;margin:18px 0 0;\">Tell me a little about what you're dreaming up — an event, a trip, or both — and I'll be in touch.<\u002Fp>\n        <ul style=\"list-style:none;margin:30px 0 0;padding:0;display:flex;flex-direction:column;gap:16px;\">\n          <li><a href=\"mailto:hayley@hayleygetsyouthere.com\" style=\"display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#0E3A40;font-size:0.96rem;\" style-hover=\"color:#C76B38;\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C76B38\" stroke-width=\"1.7\" style=\"width:20px;height:20px;\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"m3 7 9 6 9-6\"><\u002Fpath><\u002Fsvg>hayley@hayleygetsyouthere.com<\u002Fa><\u002Fli>\n          <li><a href=\"https://instagram.com/hayleygetsyouthere\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#0E3A40;font-size:0.96rem;\" style-hover=\"color:#C76B38;\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C76B38\" stroke-width=\"1.7\" style=\"width:20px;height:20px;\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.5\" cy=\"6.5\" r=\"0.6\" fill=\"#C76B38\"><\u002Fcircle><\u002Fsvg>@hayleygetsyouthere<\u002Fa><\u002Fli>\n          <li style=\"display:inline-flex;align-items:center;gap:12px;color:#0E3A40;font-size:0.96rem;\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C76B38\" stroke-width=\"1.7\" style=\"width:20px;height:20px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18\"><\u002Fpath><\u002Fsvg>Winter Garden, Florida<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid rgba(14,58,64,0.1);border-radius:8px;padding:clamp(24px,3vw,36px);box-shadow:0 14px 40px rgba(14,58,64,0.08);\">\n        <sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ true }}\">\n          <form onsubmit=\"{{ onSubmit }}\" style=\"display:flex;flex-direction:column;gap:16px;\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#0E3A40;\">Name\n              <input value=\"{{ name }}\" onchange=\"{{ onName }}\" type=\"text\" placeholder=\"Your name\" style=\"font-family:inherit;font-size:0.95rem;font-weight:400;letter-spacing:0;text-transform:none;color:#0E3A40;padding:12px 14px;border:1px solid #cdd6d3;border-radius:3px;background:#fbf9f4;\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#0E3A40;\">Email\n              <input value=\"{{ email }}\" onchange=\"{{ onEmail }}\" type=\"email\" placeholder=\"you@email.com\" style=\"font-family:inherit;font-size:0.95rem;font-weight:400;letter-spacing:0;text-transform:none;color:#0E3A40;padding:12px 14px;border:1px solid #cdd6d3;border-radius:3px;background:#fbf9f4;\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#0E3A40;\">I'm interested in\n              <select value=\"{{ type }}\" onchange=\"{{ onType }}\" style=\"font-family:inherit;font-size:0.95rem;font-weight:400;letter-spacing:0;text-transform:none;color:#0E3A40;padding:12px 14px;border:1px solid #cdd6d3;border-radius:3px;background:#fbf9f4;\">\n                <option>An event<\u002Foption>\n                <option>Travel planning<\u002Foption>\n                <option>A group experience<\u002Foption>\n                <option>Events + travel<\u002Foption>\n              <\u002Fselect>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#0E3A40;\">Message\n              <textarea value=\"{{ message }}\" onchange=\"{{ onMessage }}\" rows=\"4\" placeholder=\"Tell me about your vision…\" style=\"font-family:inherit;font-size:0.95rem;font-weight:400;letter-spacing:0;text-transform:none;color:#0E3A40;padding:12px 14px;border:1px solid #cdd6d3;border-radius:3px;background:#fbf9f4;resize:vertical;\"><\u002Ftextarea>\n            <\u002Flabel>\n            <button type=\"submit\" style=\"margin-top:4px;background:#C76B38;color:#F4EEE1;border:none;font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;padding:15px;border-radius:3px;cursor:pointer;transition:background .15s;\" style-hover=\"background:#b15d2d;\">Send inquiry<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:30px 10px;\">\n            <span style=\"display:flex;width:54px;height:54px;border-radius:50%;background:rgba(62,122,78,0.15);align-items:center;justify-content:center;margin:0 auto;color:#3E7A4E;\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"width:26px;height:26px;\"><path d=\"m5 12 5 5L20 7\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;color:#0E3A40;font-size:1.6rem;margin:18px 0 8px;\">Thank you!<\u002Fh3>\n            <p style=\"margin:0;color:#5A6B6E;font-size:0.95rem;line-height:1.6;\">Your message is ready to send. I'll get back to you soon — let's get you there.<\u002Fp>\n            <a href=\"{{ mailtoUrl }}\" style=\"display:inline-block;margin-top:20px;text-decoration:none;color:#C76B38;font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;\">Open in email →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== FOOTER ===================== -->\n  <footer style=\"background:#0E3A40;border-top:1px solid rgba(244,238,225,0.12);padding:40px 24px;\">\n    <div style=\"max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;\">\n      <a href=\"#home\" style=\"display:flex;align-items:center;gap:12px;text-decoration:none;\">\n        <img src=\"dd431bcc-cf28-4e3e-8694-6641f1faa056\" width=\"34\" height=\"42\" alt=\"\" style=\"width:34px;height:auto;\">\n        <span style=\"display:flex;flex-direction:column;line-height:1.05;\">\n          <span style=\"font-size:13px;font-weight:700;letter-spacing:0.14em;color:#F4EEE1;\">HAYLEY MARCHÉ<\u002Fspan>\n          <span style=\"font-size:9px;font-weight:600;letter-spacing:0.34em;color:#C76B38;\">EVENTS + TRAVEL<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fa>\n      <p style=\"font-family:'Dancing Script',cursive;font-size:1.4rem;color:#E9C9A8;margin:0;\">let's get you there<\u002Fp>\n      <div style=\"text-align:right;\">\n        <p style=\"margin:0;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#C9D2CF;\">© 2026 Hayley Marché · Events + Travel<\u002Fp>\n        <p style=\"margin:4px 0 0;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#7e9298;\">Winter Garden, Florida<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;heroVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;editorial&quot;,&quot;immersive&quot;,&quot;minimal&quot;],&quot;default&quot;:&quot;minimal&quot;,&quot;tsType&quot;:&quot;'editorial' | 'immersive' | 'minimal'&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    filter: 'All',\n    name: '', email: '', type: 'An event', message: '',\n    submitted: false,\n  };\n\n  renderVals() {\n    const variant = this.props.heroVariant ?? 'editorial';\n\n    const portfolio = [\n      { title: 'Milestone Birthday Soirée', category: 'Celebrations', place: 'Winter Garden, FL' },\n      { title: 'Executive Leadership Retreat', category: 'Corporate', place: 'Asheville, NC' },\n      { title: 'Alpine Anniversary Escape', category: 'Group Travel', place: 'Swiss Alps' },\n      { title: 'Coastal Welcome Dinner', category: 'Celebrations', place: 'Amalfi Coast' },\n      { title: 'Founders Offsite', category: 'Corporate', place: 'Santa Fe, NM' },\n      { title: 'Friends Reunion Voyage', category: 'Group Travel', place: 'Portugal' },\n      { title: 'Holiday Team Gala', category: 'Corporate', place: 'Orlando, FL' },\n      { title: 'Vineyard Incentive Trip', category: 'Group Travel', place: 'Tuscany' },\n    ];\n    const cats = ['All', 'Celebrations', 'Corporate', 'Group Travel'];\n    const active = this.state.filter;\n\n    const baseBtn = 'font-family:inherit;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:9px 16px;border-radius:2px;cursor:pointer;transition:all .15s;';\n    const filters = cats.map(c => ({\n      name: c,\n      onClick: () => this.setState({ filter: c }),\n      style: baseBtn + (c === active\n        ? 'background:#0E3A40;color:#F4EEE1;border:1px solid #0E3A40;'\n        : 'background:transparent;color:#0E3A40;border:1px solid rgba(14,58,64,0.28);'),\n    }));\n\n    const filteredPortfolio = active === 'All' ? portfolio : portfolio.filter(p => p.category === active);\n\n    const tints = ['#0E3A40', '#11464E', '#C76B38', '#3E7A4E', '#11464E', '#0E3A40', '#3E7A4E', '#C76B38'];\n    const igTiles = tints.map((bg, i) => ({ bg, label: 'POST ' + (i + 1) }));\n\n    const mailtoUrl = 'mailto:hayley@hayleygetsyouthere.com'\n      + '?subject=' + encodeURIComponent('Inquiry from ' + (this.state.name || 'website') + ' — ' + this.state.type)\n      + '&body=' + encodeURIComponent(\n        'Name: ' + this.state.name + '\\nEmail: ' + this.state.email\n        + '\\nInterested in: ' + this.state.type + '\\n\\n' + this.state.message);\n\n    const set = (k) => (e) => this.setState({ [k]: e.target.value });\n\n    return {\n      isEditorial: variant === 'editorial',\n      isImmersive: variant === 'immersive',\n      isMinimal: variant === 'minimal',\n\n      navLinks: [\n        { label: 'Home', href: '#home' },\n        { label: 'About', href: '#about' },\n        { label: 'Services', href: '#services' },\n        { label: 'Portfolio', href: '#portfolio' },\n        { label: 'Instagram', href: '#instagram' },\n      ],\n\n      overview: [\n        { n: '1', text: '18+ years designing events and travel, with over 3,000 personal industry contacts.' },\n        { n: '2', text: 'Expert in venue sourcing, contract negotiation, and luxury logistics.' },\n        { n: '3', text: 'Specializing in meaningful events, customized group experiences, and destination planning.' },\n        { n: '4', text: 'Trusted advisor to Fortune 100 executives, known for calm and immaculate detail.' },\n      ],\n\n      services: [\n        { n: 'i', title: 'Meaningful Events', text: 'Milestones, celebrations and gatherings designed around the people and moments that matter most.' },\n        { n: 'ii', title: 'Unforgettable Travel', text: 'Bespoke itineraries and destination planning, tailored to how you love to explore.' },\n        { n: 'iii', title: 'Group Experiences', text: 'Reunions, retreats and getaways for families, fri
