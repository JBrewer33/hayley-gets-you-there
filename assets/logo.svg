<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER LOGO — a geometric "HM" monogram with a location-pin dot,
  styled in the brand cream + copper. Swap this file for the official logo
  when you have it (keep the same filename "logo.svg", or update the <img>
  src in index.html if the real file is a .png/.jpg).
  Colors are set explicitly below so the mark renders correctly inside <img>.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Hayley Marché Events + Travel monogram">
  <g fill="none" stroke="#F4EEE1" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer uprights (shared by the H and the M) -->
    <line x1="32" y1="30" x2="32" y2="90"/>
    <line x1="88" y1="30" x2="88" y2="90"/>
    <!-- H crossbar -->
    <line x1="32" y1="56" x2="88" y2="56"/>
    <!-- M centre vee -->
    <polyline points="32,30 60,60 88,30"/>
  </g>
  <!-- copper location-pin dot -->
  <circle cx="60" cy="22" r="4.5" fill="#C76B38"/>
</svg>
